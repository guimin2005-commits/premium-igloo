    <path d="M0 -86 L88 10 L44 10 L44 54 L-44 54 L-44 10 L-88 10 Z" fill="url(#lShardC)" transform="translate(0 258)"/>
  </g>

  <g transform="translate(600 710)" text-anchor="middle" font-family="Pretendard, 'Segoe UI', Arial, sans-serif">
    <text y="0" fill="#131313" font-size="104" font-weight="900" letter-spacing="4">XP BOOST</text>
    <text x="292" y="-46" fill="#e91e3f" font-size="72" font-weight="900">+</text>
