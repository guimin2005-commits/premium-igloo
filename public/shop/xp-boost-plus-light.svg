<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="XP Boost+">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eceae6"/>
    </linearGradient>
    <linearGradient id="lShardA" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff5c77"/>
      <stop offset="100%" stop-color="#e91e3f"/>
    </linearGradient>
    <linearGradient id="lShardB" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e91e3f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e91e3f" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="lShardC" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#131313" stop-opacity="0.16"/>
